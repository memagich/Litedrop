plugins {
    id 'com.android.application'
}

android {
    namespace 'com.litedrop.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.litedrop.app'
        minSdk 29          // Android 10: MediaStore.Downloads bez dozvola za pohranu
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    // Ključ za potpisivanje je u repozitoriju da svaki build ima isti potpis
    // (nadogradnja preko starije instalacije radi). Za lični, neobjavljeni APK je to dovoljno;
    // ako repozitorij postaviš kao javan, napravi vlastiti ključ (vidi README).
    signingConfigs {
        release {
            storeFile file('litedrop-release.jks')
            storePassword 'litedrop'
            keyAlias 'litedrop'
            keyPassword 'litedrop'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
